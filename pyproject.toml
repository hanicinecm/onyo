[project]
name = "onyo"
version = "0.1.0"
description = "My personal recipe manager"
readme = "README.md"
authors = [
    { name = "Martin Hanicinec", email = "hanicinecm@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.3",
    "pyyaml>=6.0.3",
]

[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.6.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.1",
]
